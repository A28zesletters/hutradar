name: hutradar
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: hutradar
jobs:
  meet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 hutradar.py
      - run: python3 rapport.py
      - name: Data opslaan
        run: |
          git config user.name "hutradar-bot"
          git config user.email "hutradar-bot@users.noreply.github.com"
          git add data
          git commit -m "meting $(date -u +%FT%TZ)" || echo "geen wijzigingen"
          git push
